<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Mapa esquemático do Parque Ecológico de Águas Claras" style="font-family: 'Segoe UI', Arial, sans-serif; background: #F0F7F0;">
  <title>Mapa do Parque Ecológico de Águas Claras</title>
  <desc>Mapa esquemático mostrando trilhas, lago, pontos de interesse e infraestrutura do parque.</desc>

  <!-- ===== FUNDO / GRAMADO ===== -->
  <rect x="0" y="0" width="800" height="600" fill="#E8F5E9" rx="8"/>

  <!-- ===== BORDA DO PARQUE ===== -->
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#81C784" stroke-width="2" stroke-dasharray="8,4" rx="16"/>
  <text x="400" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#1B5E20">PARQUE ECOLÓGICO DE ÁGUAS CLARAS</text>

  <!-- ===== LAGO / LAGOA ===== -->
  <ellipse cx="480" cy="280" rx="120" ry="80" fill="#A8DADC" stroke="#457B9D" stroke-width="2" opacity="0.9"/>
  <text x="480" y="275" text-anchor="middle" font-size="13" fill="#1D3557" font-weight="600">Lagoa</text>
  <text x="480" y="293" text-anchor="middle" font-size="10" fill="#457B9D">🦆</text>

  <!-- ===== ÁRVORES / VEGETAÇÃO ===== -->
  <!-- Grupo noroeste -->
  <circle cx="100" cy="100" r="18" fill="#4CAF50" opacity="0.6"/>
  <circle cx="130" cy="85" r="14" fill="#388E3C" opacity="0.5"/>
  <circle cx="80" cy="120" r="12" fill="#66BB6A" opacity="0.6"/>
  <circle cx="145" cy="110" r="16" fill="#43A047" opacity="0.5"/>

  <!-- Grupo nordeste -->
  <circle cx="650" cy="90" r="20" fill="#4CAF50" opacity="0.6"/>
  <circle cx="680" cy="110" r="14" fill="#388E3C" opacity="0.5"/>
  <circle cx="620" cy="105" r="12" fill="#66BB6A" opacity="0.6"/>
  <circle cx="700" cy="80" r="10" fill="#43A047" opacity="0.5"/>

  <!-- Grupo leste (perto do lago) -->
  <circle cx="630" cy="260" r="16" fill="#4CAF50" opacity="0.5"/>
  <circle cx="645" cy="290" r="12" fill="#388E3C" opacity="0.5"/>
  <circle cx="620" cy="310" r="14" fill="#66BB6A" opacity="0.4"/>

  <!-- Grupo sul -->
  <circle cx="200" cy="450" r="15" fill="#4CAF50" opacity="0.5"/>
  <circle cx="225" cy="470" r="12" fill="#388E3C" opacity="0.5"/>
  <circle cx="180" cy="465" r="10" fill="#66BB6A" opacity="0.5"/>

  <!-- Grupo oeste -->
  <circle cx="70" cy="300" r="16" fill="#4CAF50" opacity="0.5"/>
  <circle cx="55" cy="270" r="12" fill="#388E3C" opacity="0.6"/>
  <circle cx="85" cy="330" r="10" fill="#66BB6A" opacity="0.5"/>

  <!-- Grupo centro-norte -->
  <circle cx="300" cy="100" r="14" fill="#43A047" opacity="0.5"/>
  <circle cx="330" cy="80" r="18" fill="#4CAF50" opacity="0.4"/>
  <circle cx="280" cy="85" r="10" fill="#66BB6A" opacity="0.5"/>

  <!-- ===== TRILHAS / CAMINHOS ===== -->
  <!-- Trilha principal (entrada → centro → lago) -->
  <path d="M 400 560 L 400 480 Q 400 440 380 400 L 350 340 Q 330 300 340 260 L 360 220 Q 370 200 380 180" 
        fill="none" stroke="#2D6A4F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Trilha ao redor do lago -->
  <path d="M 360 220 Q 380 200 420 190 Q 480 170 540 200 Q 610 240 610 280 Q 610 340 540 370 Q 480 390 420 370 Q 370 350 350 320 Q 330 300 340 260 L 360 220" 
        fill="none" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>

  <!-- Trilha norte -->
  <path d="M 380 180 Q 350 140 300 120 Q 250 100 200 110 Q 160 120 140 140" 
        fill="none" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round"/>

  <!-- Trilha sul-oeste (alternativa) -->
  <path d="M 350 340 Q 300 360 260 380 Q 220 400 200 430 Q 185 450 180 480" 
        fill="none" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,6" opacity="0.7"/>
  <text x="215" y="395" font-size="9" fill="#2D6A4F" transform="rotate(-30, 215, 395)">trilha alternativa</text>

  <!-- Trilha leste -->
  <path d="M 540 200 Q 580 170 620 150 Q 660 130 680 120" 
        fill="none" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== TRECHO POUCO ILUMINADO (destaque) ===== -->
  <path d="M 300 120 Q 250 100 200 110 Q 160 120 140 140" 
        fill="none" stroke="#FFA726" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- ===== PONTOS DE INTERESSE ===== -->

  <!-- 1. Entrada Principal -->
  <g id="entrada-principal">
    <rect x="378" y="545" width="44" height="24" rx="4" fill="#1B5E20" stroke="#fff" stroke-width="1"/>
    <text x="400" y="561" text-anchor="middle" font-size="11" fill="white" font-weight="bold">⛩️</text>
    <text x="400" y="540" text-anchor="middle" font-size="10" fill="#1B5E20" font-weight="600">Entrada Principal</text>
  </g>

  <!-- 2. Vagas Preferenciais -->
  <g id="vagas-preferenciais">
    <rect x="438" y="530" width="20" height="20" rx="3" fill="#1565C0" stroke="#fff" stroke-width="1"/>
    <text x="448" y="545" text-anchor="middle" font-size="11" fill="white">🅿️</text>
    <text x="490" y="540" font-size="9" fill="#1565C0" font-weight="600">Vagas Preferenciais</text>
  </g>

  <!-- 3. Banheiro Acessível (PCD) -->
  <g id="banheiro-pcd">
    <circle cx="385" cy="445" r="12" fill="#0277BD" stroke="#fff" stroke-width="1.5"/>
    <text x="385" y="449" text-anchor="middle" font-size="11" fill="white">♿</text>
    <text x="405" y="440" font-size="9" fill="#0277BD" font-weight="600">Banheiro PCD</text>
  </g>

  <!-- 4. Ponto de Coleta Seletiva -->
  <g id="coleta-seletiva">
    <circle cx="340" cy="260" r="12" fill="#2E7D32" stroke="#fff" stroke-width="1.5"/>
    <text x="340" y="264" text-anchor="middle" font-size="11" fill="white">♻️</text>
    <text x="295" y="250" font-size="9" fill="#2E7D32" font-weight="600" text-anchor="end">Coleta Seletiva</text>
  </g>

  <!-- 5. Lixeiras Recicláveis — Lago -->
  <g id="lixeira-reciclavel-1">
    <rect x="420" y="375" width="16" height="16" rx="3" fill="#4CAF50" stroke="#fff" stroke-width="1"/>
    <text x="428" y="388" text-anchor="middle" font-size="9" fill="white">🗑</text>
    <text x="448" y="387" font-size="8" fill="#4CAF50" font-weight="600">Lixeiras — Lago</text>
  </g>

  <!-- 6. Lixeiras Recicláveis — Trilha Norte -->
  <g id="lixeira-reciclavel-2">
    <rect x="185" y="108" width="16" height="16" rx="3" fill="#4CAF50" stroke="#fff" stroke-width="1"/>
    <text x="193" y="121" text-anchor="middle" font-size="9" fill="white">🗑</text>
    <text x="210" y="105" font-size="8" fill="#4CAF50" font-weight="600">Lixeiras — Trilha Norte</text>
  </g>

  <!-- 7. Trecho Pouco Iluminado -->
  <g id="trecho-pouco-iluminado">
    <polygon points="230,135 238,150 222,150" fill="#FF9800" stroke="#fff" stroke-width="1"/>
    <text x="230" y="148" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">!</text>
    <text x="230" y="165" text-anchor="middle" font-size="8" fill="#E65100" font-weight="600">Trecho pouco iluminado</text>
  </g>

  <!-- ===== LEGENDA ===== -->
  <g transform="translate(570, 420)">
    <rect x="0" y="0" width="190" height="155" rx="8" fill="white" stroke="#C8E6C9" stroke-width="1.5" opacity="0.95"/>
    <text x="95" y="20" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">LEGENDA</text>
    
    <!-- Trilha -->
    <line x1="15" y1="38" x2="45" y2="38" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round"/>
    <text x="55" y="42" font-size="9" fill="#333">Trilha</text>

    <!-- Trilha alternativa -->
    <line x1="15" y1="55" x2="45" y2="55" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4" opacity="0.7"/>
    <text x="55" y="59" font-size="9" fill="#333">Trilha alternativa</text>

    <!-- Lagoa -->
    <ellipse cx="30" cy="72" rx="15" ry="8" fill="#A8DADC" stroke="#457B9D" stroke-width="1"/>
    <text x="55" y="76" font-size="9" fill="#333">Lagoa</text>

    <!-- Árvore -->
    <circle cx="30" cy="90" r="7" fill="#4CAF50" opacity="0.6"/>
    <text x="55" y="94" font-size="9" fill="#333">Vegetação</text>

    <!-- Entrada -->
    <rect x="22" y="102" width="16" height="12" rx="2" fill="#1B5E20"/>
    <text x="55" y="112" font-size="9" fill="#333">Entrada</text>

    <!-- Banheiro PCD -->
    <circle cx="30" cy="126" r="7" fill="#0277BD"/>
    <text x="55" y="130" font-size="9" fill="#333">Banheiro PCD ♿</text>

    <!-- Alerta -->
    <polygon points="30,138 35,148 25,148" fill="#FF9800"/>
    <text x="55" y="148" font-size="9" fill="#333">Atenção</text>
  </g>

  <!-- ===== ROSA DOS VENTOS (simplificada) ===== -->
  <g transform="translate(710, 60)">
    <circle cx="0" cy="0" r="22" fill="white" stroke="#81C784" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="-8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">N</text>
    <polygon points="0,-18 -4,-10 4,-10" fill="#1B5E20"/>
    <text x="0" y="16" text-anchor="middle" font-size="8" fill="#999">S</text>
    <text x="14" y="4" text-anchor="middle" font-size="8" fill="#999">L</text>
    <text x="-14" y="4" text-anchor="middle" font-size="8" fill="#999">O</text>
  </g>

  <!-- ===== NOTA DE RODAPÉ ===== -->
  <text x="400" y="592" text-anchor="middle" font-size="8" fill="#999" font-style="italic">Mapa esquemático — não representa escala real. Dados de exemplo para o app Trilha Clara.</text>
</svg>
